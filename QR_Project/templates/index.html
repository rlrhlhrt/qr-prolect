<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LF QR">
<link rel="apple-touch-icon" href="/static/icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="doc.title">Lost &amp; Found QR Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-container app-shell">
    <header class="app-header">
      <div class="app-header__main">
        <h1 class="app-title" data-i18n="app.title">Lost &amp; Found QR Generator</h1>
        <p class="app-subtitle" data-i18n="app.subtitle">Secure tag: contains only the item name and phone. Full details are stored in history.</p>
      </div>
      <div class="app-header__settings settings-bar" aria-label="Display settings">
        <div class="settings-bar__group">
          <label class="settings-bar__label" for="theme-select" data-i18n="settings.theme">Theme</label>
          <select id="theme-select" class="glass-select" name="theme" aria-describedby="theme-select-hint">
            <option value="system" data-i18n="theme.system">Системная</option>
            <option value="dark" data-i18n="theme.dark">Темная</option>
            <option value="light" data-i18n="theme.light">Светлая</option>
          </select>
        </div>
        <div class="settings-bar__group">
          <label class="settings-bar__label" for="lang-select" data-i18n="settings.language">Language</label>
          <select id="lang-select" class="glass-select" name="language">
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </div>
        <div class="settings-bar__group settings-bar__group--accent">
          <label class="settings-bar__label" for="accent-color-picker" data-i18n="settings.accentColor">Accent Color</label>
          <div class="accent-picker" data-i18n-title="settings.accentColor" title="Accent Color">
            <span class="accent-picker__ring" aria-hidden="true"></span>
            <span class="accent-picker__swatch" aria-hidden="true"></span>
            <input type="color" id="accent-color-picker" class="accent-picker__input" value="#6366f1" data-i18n-aria-label="settings.accentColor" aria-label="Accent color">
          </div>
        </div>
      </div>
    </header>

    <main class="layout" role="main">
      <div class="column column--form card card-form">
        <h2 class="card-title" data-i18n="card.formTitle">Item details</h2>
        <form id="record-form" class="form" novalidate>
          <div class="field">
            <label class="field-label" for="item_name" data-i18n="field.itemName">Item name</label>
            <input type="text" id="item_name" name="item_name" autocomplete="off" data-i18n-placeholder="ph.itemName" placeholder="Item name" required>
          </div>
          <div class="field">
            <label class="field-label" for="full_name" data-i18n="field.fullName">Full name</label>
            <input type="text" id="full_name" name="full_name" autocomplete="name" data-i18n-placeholder="ph.fullName" placeholder="Full name">
          </div>
          <div class="field">
            <label class="field-label" for="address" data-i18n="field.address">Address</label>
            <input type="text" id="address" name="address" autocomplete="street-address" data-i18n-placeholder="ph.address" placeholder="Address">
          </div>
          <div class="field">
            <label class="field-label" for="phone" data-i18n="field.phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" data-i18n-placeholder="ph.phone" placeholder="Phone" required>
          </div>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn-primary" id="btn-add" data-i18n="btn.generate">Generate QR Code</button>
          <button type="button" class="btn btn-primary" id="btn-export-json" data-i18n="btn.exportJson">Export History to JSON</button>
        </form>
      </div>

      <div class="column column--preview card card-preview">
        <h2 class="card-title" data-i18n="card.previewTitle">Preview &amp; history</h2>

        <section class="preview-panel" aria-labelledby="preview-panel-heading">
          <h3 id="preview-panel-heading" class="sr-only" data-i18n="preview.srTitle">QR code preview</h3>
          <div class="qr-block">
            <div class="qr-frame" id="qr-frame">
              <img id="qr-image" class="qr-image" data-i18n-alt="alt.qr" alt="Generated QR code" width="250" height="250" hidden>
              <p id="qr-placeholder" class="qr-placeholder" data-i18n="qr.placeholder">QR preview</p>
            </div>
            <div class="action-row action-row--qr">
              <button type="button" class="btn btn-primary" id="btn-download-png" data-i18n="btn.savePng">Save QR to PNG</button>
              <button type="button" class="btn btn-primary" id="btn-print" data-i18n="btn.print">Print QR Code</button>
            </div>
          </div>
        </section>

        <section class="history-panel" aria-labelledby="history-panel-heading">
          <h3 id="history-panel-heading" class="card-title" data-i18n="history.title">History</h3>
          <div class="table-wrap">
            <table class="history-table" id="history-table">
              <thead>
                <tr>
                  <th scope="col" data-i18n="th.id">ID</th>
                  <th scope="col" data-i18n="th.item">Item</th>
                  <th scope="col" data-i18n="th.name">Name</th>
                  <th scope="col" data-i18n="th.phone">Phone</th>
                  <th scope="col" data-i18n="th.date">Date</th>
                  <th scope="col" data-i18n="th.action">Action</th>
                </tr>
              </thead>
              <tbody id="history-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="print-root" class="print-root" aria-hidden="true">
    <img id="print-qr" class="print-qr" data-i18n-alt="alt.qrPrint" alt="">
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
